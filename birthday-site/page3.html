<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Question... 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Full page static image background — using local cat image */
  .bg-img {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('images/Felicidad.jpg');
    background-size: cover;
    background-position: center 65%;
    background-repeat: no-repeat;
  }

  /* Semi-transparent overlay so text is readable */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(0,0,0,0.25);
  }

  /* Center content */
  .center {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 32px;
    padding: 30px 30px 30px 80px;
  }

  /* Question card */
  .question-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid rgba(255,180,240,0.4);
    border-radius: 32px;
    padding: 38px 50px;
    text-align: center;
    box-shadow: 0 8px 50px rgba(200,50,200,0.3);
    animation: cardFloat 0.8s cubic-bezier(0.34,1.56,0.64,1) both;
  }

  @keyframes cardFloat {
    from { transform: translateY(80px) scale(0.8); opacity: 0; }
    to   { transform: translateY(0)    scale(1);   opacity: 1; }
  }

  .paw-emoji {
    font-size: 3rem;
    display: block;
    margin-bottom: 12px;
    animation: pawBounce 1.5s ease-in-out infinite;
  }

  @keyframes pawBounce {
    0%, 100% { transform: scale(1) rotate(-10deg); }
    50%       { transform: scale(1.2) rotate(10deg); }
  }

  .question-text {
    font-family: 'Pacifico', cursive;
    font-size: clamp(2rem, 7vw, 3.5rem);
    color: #fff;
    text-shadow:
      0 0 20px rgba(255,150,220,0.9),
      0 0 40px rgba(200,100,255,0.5),
      0 4px 0 rgba(100,30,150,0.4);
    line-height: 1.2;
    animation: textPulse 3s ease-in-out infinite;
  }

  @keyframes textPulse {
    0%,100% { text-shadow: 0 0 20px rgba(255,150,220,0.9), 0 0 40px rgba(200,100,255,0.5); }
    50%      { text-shadow: 0 0 40px rgba(255,100,200,1),   0 0 80px rgba(200,100,255,0.9), 0 0 120px rgba(150,50,200,0.4); }
  }

  .hint-text {
    color: rgba(255,220,240,0.75);
    font-size: 0.9rem;
    margin-top: 10px;
    font-weight: 600;
    font-style: italic;
  }

  /* YES button */
  .btn-yes {
    display: inline-block;
    background: linear-gradient(135deg, #22c55e, #16a34a, #15803d);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    padding: 16px 52px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 30px rgba(34,197,94,0.5);
    transition: transform 0.2s, box-shadow 0.2s;
    letter-spacing: 1px;
    animation: yesGlow 2s ease-in-out infinite;
  }

  @keyframes yesGlow {
    0%,100% { box-shadow: 0 6px 30px rgba(34,197,94,0.5); }
    50%      { box-shadow: 0 6px 50px rgba(34,197,94,0.85), 0 0 0 8px rgba(34,197,94,0.12); }
  }

  .btn-yes:hover {
    transform: translateY(-5px) scale(1.07);
    box-shadow: 0 12px 40px rgba(34,197,94,0.7);
  }

  /* NO button — fixed so it can be moved anywhere */
  .btn-no {
    background: linear-gradient(135deg, #ef4444, #dc2626, #b91c1c);
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    padding: 16px 52px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    box-shadow: 0 6px 30px rgba(239,68,68,0.5);
    letter-spacing: 1px;
    position: fixed;
    z-index: 100;
    user-select: none;
    -webkit-user-select: none;
    transition: left 0.22s cubic-bezier(0.34,1.56,0.64,1), top 0.22s cubic-bezier(0.34,1.56,0.64,1);
  }

  /* Nope message pop */
  .nope-msg {
    position: fixed;
    pointer-events: none;
    font-size: 1.5rem;
    font-weight: 900;
    color: #ff6b6b;
    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    z-index: 200;
    animation: nopeFade 0.8s ease forwards;
    white-space: nowrap;
  }

  @keyframes nopeFade {
    0%   { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.5) translateY(-30px); }
  }

  /* Transition */
  .page-transition {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #22c55e, #16a34a);
    z-index: 999;
    transform: translateX(-100%);
    transition: transform 0.5s cubic-bezier(0.77,0,0.18,1);
  }
  .page-transition.active { transform: translateX(0); }
</style>
</head>
<body>

<div class="bg-img"></div>
<div class="overlay"></div>
<div class="page-transition" id="pt"></div>

<div class="center">
  <div class="question-card">
    <span class="paw-emoji">🐾</span>
    <div class="question-text">Party kodsu?</div>
    <div class="hint-text">(choose wisely... or not 😏)</div>
  </div>

  <div>
    <button class="btn-yes" onclick="goYes()">YES 🥳</button>
  </div>
</div>

<!-- NO button lives outside flex flow so it can go anywhere -->
<button class="btn-no" id="noBtn" onmouseenter="runAway(event)" ontouchstart="runAway(event)">NO 😤</button>

<script>
  const noBtn = document.getElementById('noBtn');
  let noClickCount = 0;
  let placed = false;

  function placeNoBtn() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const bw = noBtn.offsetWidth  || 170;
    const bh = noBtn.offsetHeight || 60;
    const x  = Math.min(vw / 2 + 110, vw - bw - 12);
    const y  = Math.min(vh / 2 + 20,  vh - bh - 12);
    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';
    placed = true;
  }

  window.addEventListener('load', () => setTimeout(placeNoBtn, 150));

  const noMessages = [
    'Nuh uh! 😝', 'Nice try! 😂', 'NOT happening! 🙅',
    'Run run run! 🏃', 'Catch me! 😜', 'lolol nope 😂',
    'Too slow! ⚡', 'hehe byeee 👋', 'NEVER 😈'
  ];

  function runAway(e) {
    const vw  = window.innerWidth;
    const vh  = window.innerHeight;
    const bw  = noBtn.offsetWidth;
    const bh  = noBtn.offsetHeight;
    const pad = 14;
    const curX = parseFloat(noBtn.style.left) || vw / 2;
    const curY = parseFloat(noBtn.style.top)  || vh / 2;

    let x, y, attempts = 0;
    do {
      x = pad + Math.random() * (vw - bw - pad * 2);
      y = pad + Math.random() * (vh - bh - pad * 2);
      attempts++;
    } while (Math.abs(x - curX) < 140 && Math.abs(y - curY) < 140 && attempts < 25);

    noBtn.style.left = x + 'px';
    noBtn.style.top  = y + 'px';

    noClickCount++;
    const msg = document.createElement('div');
    msg.className = 'nope-msg';
    msg.textContent = noMessages[noClickCount % noMessages.length];
    msg.style.left = (x + bw / 2 - 80) + 'px';
    msg.style.top  = (y - 44) + 'px';
    document.body.appendChild(msg);
    setTimeout(() => msg.remove(), 800);
  }

  function goYes() {
    document.getElementById('pt').classList.add('active');
    setTimeout(() => window.location.href = 'page4.html', 500);
  }
</script>
</body>
</html>
